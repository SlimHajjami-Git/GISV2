# =============================================================================
# GIS V2 - Applications: gis-api, gps-ingest, frontend, mobile
# =============================================================================

# -----------------------------------------------------------------------------
# GIS API (.NET) — scalable to 2+ replicas
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: gis-api
  namespace: gisv2
  labels:
    app: gis-api
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: gis-api

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gis-uploads
  namespace: gisv2
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
# Sauvegardes pg_dump (backups manuels + CronJob nocturne + backups pré-purge).
# Monté dans gis-api (/backups) et dans le CronJob db-backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups
  namespace: gisv2
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
# Sauvegarde automatique nocturne (02:30) — pg_dump -Fc + rotation.
# Rétention : 3 quotidiennes + 2 hebdomadaires (lundi) + 3 pré-purge.
# Les manual_ ne sont JAMAIS touchées (gérées depuis l'écran admin).
# Utilise l'image postgis (contient pg_dump/pg_restore avec zstd).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: gisv2
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: pg-backup
              image: postgis/postgis:16-3.4-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: gisv2-secrets
                      key: POSTGRES_PASSWORD
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date +%Y%m%d-%H%M%S)
                  DOW=$(date +%u)   # 1 = lundi
                  KEEP_DAILY=3
                  KEEP_WEEKLY=2
                  KEEP_PRESUPPR=3
                  # Le temporaire commence par un point et finit par .part : il
                  # n'est capturé par AUCUN glob de rotation (auto_*/weekly_*).
                  TMP=/backups/.auto_${STAMP}.part
                  OUT=/backups/auto_${STAMP}.dump

                  # ---------------------------------------------------------
                  # ORDRE CRITIQUE : dump -> validation -> publication -> rotation.
                  # L'ancienne version faisait la rotation AVANT le dump. Quand le
                  # disque se remplit, pg_dump échoue et laisse un fichier partiel ;
                  # la nuit suivante `ls -1t` le classe en tête (le plus récent) et
                  # le CONSERVE, en supprimant une sauvegarde VALIDE à la place. En
                  # quelques nuits il ne restait que des fichiers corrompus, sans
                  # aucune alerte. On ne supprime donc plus rien tant qu'une
                  # nouvelle sauvegarde valide n'est pas publiée.
                  # ---------------------------------------------------------

                  # Nettoyage des tentatives interrompues des nuits précédentes.
                  rm -f /backups/.auto_*.part 2>/dev/null || true

                  # Place nécessaire = plus gros dump existant + 20 % de marge.
                  REF_KB=$(du -k /backups/*.dump 2>/dev/null | sort -rn | head -1 | cut -f1 || true)
                  [ -n "${REF_KB:-}" ] || REF_KB=3145728
                  NEED_KB=$(( REF_KB + REF_KB / 5 ))
                  FREE_KB=$(df -Pk /backups | awk 'NR==2{print $4}')

                  if [ "$FREE_KB" -lt "$NEED_KB" ]; then
                    echo "ATTENTION: espace insuffisant (libre ${FREE_KB}k < requis ${NEED_KB}k) — rotation anticipée"
                    ls -1t /backups/auto_*.dump 2>/dev/null | tail -n +${KEEP_DAILY} | xargs -r rm -f
                    FREE_KB=$(df -Pk /backups | awk 'NR==2{print $4}')
                    if [ "$FREE_KB" -lt "$NEED_KB" ]; then
                      echo "ECHEC: espace toujours insuffisant. Sauvegardes existantes CONSERVEES intactes."
                      exit 1
                    fi
                  fi

                  # 1) Dump. zstd:9 = ~16 % plus petit que gzip:6 et plus rapide.
                  #    NE JAMAIS descendre à zstd:3 : mesuré +2,8 % sur ce schéma
                  #    (gps_alerts s'y comprime 15 % moins bien qu'en gzip).
                  echo "pg_dump -> $TMP"
                  pg_dump -Fc --compress=zstd:9 -h postgres -p 5432 -U postgres -d gis_v2 -f "$TMP"

                  # 2) Validation : un dump illisible ne doit jamais remplacer un
                  #    dump sain. pg_restore -l lit la table des matières.
                  echo "validation du dump (pg_restore -l)"
                  pg_restore -l "$TMP" > /dev/null

                  # 3) Publication atomique (même système de fichiers).
                  mv "$TMP" "$OUT"
                  echo "OK -> $OUT ($(du -h "$OUT" | cut -f1))"

                  # 4) Copie hebdomadaire le lundi.
                  if [ "$DOW" = "1" ]; then cp "$OUT" "/backups/weekly_${STAMP}.dump"; fi

                  # 5) Rotation — UNIQUEMENT après une sauvegarde valide publiée.
                  ls -1t /backups/auto_*.dump 2>/dev/null | tail -n +$((KEEP_DAILY+1)) | xargs -r rm -f
                  if [ "$DOW" = "1" ]; then ls -1t /backups/weekly_*.dump 2>/dev/null | tail -n +$((KEEP_WEEKLY+1)) | xargs -r rm -f; fi
                  ls -1t /backups/presuppr_*.dump 2>/dev/null | tail -n +$((KEEP_PRESUPPR+1)) | xargs -r rm -f

                  echo "Backups présents :"; ls -lh /backups/*.dump 2>/dev/null || true
                  df -h /backups | tail -1
              volumeMounts:
                - name: db-backups
                  mountPath: /backups
          volumes:
            - name: db-backups
              persistentVolumeClaim:
                claimName: db-backups

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-api
  namespace: gisv2
spec:
  # 8GB VPS: 1 replica. Scale to 2 if you upgrade to 16GB.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gis-api
  template:
    metadata:
      labels:
        app: gis-api
    spec:
      initContainers:
        # Wait for infrastructure to be ready before starting
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "Waiting for rabbitmq..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done']
      containers:
        - name: gis-api
          image: registry.local:5000/gisv2/gis-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: ASPNETCORE_URLS
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres;Database=gis_v2;Username=postgres;Password=$(POSTGRES_PASSWORD)"
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: JWT_SECRET_KEY
            - name: Jwt__Issuer
              value: "GisAPI"
            - name: Jwt__Audience
              value: "GisAPI"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: RABBITMQ_PASSWORD
            - name: RabbitMQ__Host
              value: "rabbitmq"
            - name: RabbitMQ__Port
              value: "5672"
            - name: RabbitMQ__Username
              value: "$(RABBITMQ_USER)"
            - name: RabbitMQ__Password
              value: "$(RABBITMQ_PASSWORD)"
            - name: RabbitMQ__Exchange
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: RABBITMQ_EXCHANGE
            - name: RabbitMQ__Queue
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: RABBITMQ_QUEUE
            - name: RabbitMQ__RoutingKey
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: RABBITMQ_ROUTING_KEY
            - name: Redis__ConnectionString
              value: "redis:6379,abortConnect=false"
            - name: Valhalla__Url
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: VALHALLA_URL
            - name: Nominatim__Url
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: NOMINATIM_URL
            - name: Groq__ApiKey
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: GROQ_API_KEY
            - name: Groq__ApiUrl
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: GROQ_API_URL
            - name: Groq__Model
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: GROQ_MODEL
            # Adresse publique servant à composer les liens envoyés par email
            # (confirmation d'inscription). Doit être une URL réellement
            # joignable : le défaut du code (gpa.belive.tn) n'existe pas en DNS.
            # Passer en https le jour où k8s/SSL-TN-RUNBOOK.md est appliqué.
            - name: App__PublicBaseUrl
              value: "http://belive-calypso.com"
            # Inscription libre. Deuxième moitié de l'interrupteur : sans ceci
            # l'endpoint /api/auth/register répond 404, même bouton affiché.
            - name: Registration__SelfSignupEnabled
              value: "true"
            - name: Registration__DefaultPlanCode
              value: "plan-basique"
            - name: Registration__TrialDays
              value: "14"
            # CORS — allow both internal K8s and external domain.
            # Les entrées *.calypso.com d'origine visaient des domaines FICTIFS
            # (jamais en DNS) ; remplacées par le vrai domaine servi en HTTPS.
            # L'origine par IP reste : l'APK mobile en circulation la cible.
            - name: Cors__AllowedOrigins__0
              value: "http://frontend:80"
            - name: Cors__AllowedOrigins__1
              value: "https://www.belive-calypso.com"
            - name: Cors__AllowedOrigins__2
              value: "https://belive-calypso.com"
            - name: Cors__AllowedOrigins__3
              value: "http://41.231.5.146"
            # SMTP Email
            - name: Emailer__SmtpHost
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: SMTP_HOST
            - name: Emailer__SmtpPort
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: SMTP_PORT
            - name: Emailer__Ssl
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: SMTP_SSL
            - name: Emailer__FromName
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: SMTP_FROM_NAME
            - name: Emailer__FromEmail
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: SMTP_FROM_EMAIL
            - name: Emailer__SmtpUser
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: SMTP_USER
            - name: Emailer__SmtpPassword
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: SMTP_PASSWORD
            # Firebase Cloud Messaging — service account JSON mounted from Secret
            # See k8s/README.md: the firebase-sa Secret must be created manually once
            # on the server with the file from Firebase Console > Service Accounts.
            - name: Firebase__ServiceAccountPath
              value: "/etc/firebase/sa.json"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: firebase-sa
              mountPath: /etc/firebase
              readOnly: true
            - name: db-backups
              mountPath: /backups
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: gis-uploads
        - name: db-backups
          persistentVolumeClaim:
            claimName: db-backups
        - name: firebase-sa
          secret:
            secretName: firebase-sa
            # optional=true so the pod still starts if the Secret hasn't been
            # provisioned yet; FcmService logs a warning and disables push,
            # which is a safer failure mode than a crash loop.
            optional: true
            items:
              - key: sa.json
                path: sa.json

---
# -----------------------------------------------------------------------------
# GPS Ingest (Rust) — single replica, needs host TCP/UDP ports for trackers
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: gps-ingest
  namespace: gisv2
  labels:
    app: gps-ingest
spec:
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: gps-ingest

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gps-ingest
  namespace: gisv2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gps-ingest
  template:
    metadata:
      labels:
        app: gps-ingest
    spec:
      # hostNetwork: true would also work but is less isolated
      initContainers:
        # Au redémarrage du serveur, les pods démarrent avant que CoreDNS ne
        # soit opérationnel. Le bootstrap Rust échoue alors sur la RÉSOLUTION
        # de nom ("failed to lookup address information") et le conteneur meurt
        # aussitôt : constaté 5 CrashLoopBackOff sur DZ après le boot du
        # 26/07, pendant lesquels aucune trame GPS n'était ingérée.
        # main.rs propage l'erreur (`?`) pour les TROIS dépendances — postgres,
        # rabbitmq et redis — donc on attend les trois, comme le fait gis-api.
        # `until nc -z` boucle sur l'échec DNS au lieu de crasher.
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for postgres..."; sleep 2; done']
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z rabbitmq 5672; do echo "Waiting for rabbitmq..."; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do echo "Waiting for redis..."; sleep 2; done']
      containers:
        - name: gps-ingest
          image: registry.local:5000/gisv2/gps-ingest:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
            # TCP ports for GPS trackers — exposed via hostPort
            - containerPort: 6100
              hostPort: 6100
              protocol: TCP
            - containerPort: 6200
              hostPort: 6200
              protocol: TCP
            - containerPort: 6210
              hostPort: 6210
              protocol: TCP
            - containerPort: 6300
              hostPort: 6300
              protocol: UDP
            # Teltonika (Codec 8/8E), Concox GT06, Coban TK103 — added with
            # the multi-protocol ingest support. hostPort so external trackers
            # reach them directly on the node IP.
            - containerPort: 6400
              hostPort: 6400
              protocol: TCP
            - containerPort: 6500
              hostPort: 6500
              protocol: TCP
            - containerPort: 6600
              hostPort: 6600
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/gis_v2"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gisv2-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: RABBITMQ_EXCHANGE
            - name: RABBITMQ_ROUTING_KEY
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: RABBITMQ_ROUTING_KEY
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: API_PORT
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: gisv2-config
                  key: RUST_LOG
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "384Mi"
              cpu: "800m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3

---
# -----------------------------------------------------------------------------
# Frontend Nginx config for K8s (Traefik handles API/SignalR routing)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: gisv2
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # SPA fallback - route all requests to index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html ne doit JAMAIS etre mis en cache : il reference les chunks
        # JS/CSS hashes par contenu. Un index.html perime pointe vers d'anciens
        # chunks -> apres chaque deploiement le navigateur execute du vieux code
        # (dashboard admin fige/vide) ou tombe en 404. Exact-match = priorite max,
        # s'applique aussi au fallback SPA (redirection interne try_files).
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Uploaded files proxy (photos, documents) to .NET backend
        # ^~ ensures this takes precedence over regex location for static assets (.jpg, .png, etc.)
        location ^~ /uploads/ {
            proxy_pass http://gis-api:5000/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }

---
# -----------------------------------------------------------------------------
# Frontend (Angular + Nginx)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gisv2
  labels:
    app: frontend
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gisv2
spec:
  # 8GB VPS: 1 replica. Scale to 2 if you upgrade to 16GB.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: registry.local:5000/gisv2/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: frontend-nginx-config

---
# -----------------------------------------------------------------------------
# Mobile Nginx config for K8s (Traefik handles API/SignalR routing)
# Same approach as frontend: no proxy blocks, pure static serving
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mobile-nginx-config
  namespace: gisv2
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Mobile app served under /mobile/ prefix
        # Files are deployed to /usr/share/nginx/html/mobile/ via BASE_HREF build arg
        location /mobile/ {
            try_files $uri $uri/ /mobile/index.html;

            # Cache static assets (nested so try_files still applies)
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Redirect /mobile (no trailing slash) to /mobile/
        location = /mobile {
            return 301 /mobile/;
        }

        # Health check (root level for K8s probes)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Root redirect to /mobile/
        location = / {
            return 301 /mobile/;
        }
    }

---
# -----------------------------------------------------------------------------
# Mobile (Ionic/Angular PWA + Nginx)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mobile
  namespace: gisv2
  labels:
    app: mobile
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: mobile

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile
  namespace: gisv2
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mobile
  template:
    metadata:
      labels:
        app: mobile
    spec:
      containers:
        - name: mobile
          image: registry.local:5000/gisv2/mobile:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # /health répond 200 sans dépendre du contenu déployé : sonder /
          # suivait la redirection 301 → /mobile/ et tuait le pod dès que le
          # contenu était mal placé (CrashLoop au lieu d'un simple 500 visible).
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nginx-config
          configMap:
            name: mobile-nginx-config
