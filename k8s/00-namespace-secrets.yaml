# =============================================================================
# GIS V2 - Kubernetes Namespace, Secrets & ConfigMap
# Target: K3s on single VPS (Ubuntu 22.04+)
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: gisv2
  labels:
    app.kubernetes.io/part-of: gisv2

---
# =============================================================================
# Secrets — CHANGE ALL VALUES before deploying to production!
# Generate base64: echo -n 'YourValue' | base64
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: gisv2-secrets
  namespace: gisv2
type: Opaque
data:
  # echo -n 'Calypso@2026+' | base64
  POSTGRES_PASSWORD: Q2FseXBzb0AyMDI2Kw==
  # echo -n 'gisadmin' | base64
  RABBITMQ_USER: Z2lzYWRtaW4=
  # echo -n 'Calypso@2026+' | base64
  RABBITMQ_PASSWORD: Q2FseXBzb0AyMDI2Kw==
  # echo -n 'YourSuperSecretKeyForProductionAtLeast32Characters!' | base64
  JWT_SECRET_KEY: WW91clN1cGVyU2VjcmV0S2V5Rm9yUHJvZHVjdGlvbkF0TGVhc3QzMkNoYXJhY3RlcnMh
  # REPLACE with: echo -n 'your-real-groq-key' | base64
  GROQ_API_KEY: eW91ci1ncm9xLWFwaS1rZXk=
  # Relais Topnet (port 25) = SANS authentification : il relaie selon l'IP du
  # serveur. Laisser VIDE => l'API envoie en anonyme (voir EmailService.cs).
  # Ne renseigner que pour un relais authentifie (ex. Brevo/587).
  SMTP_USER: ""
  SMTP_PASSWORD: ""

---
# =============================================================================
# ConfigMap — non-sensitive configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: gisv2-config
  namespace: gisv2
data:
  # PostgreSQL
  POSTGRES_DB: "gis_v2"
  POSTGRES_USER: "postgres"

  # .NET API
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5000"

  # RabbitMQ
  RABBITMQ_EXCHANGE: "telemetry.raw"
  RABBITMQ_QUEUE: "gps.telemetry.dotnet"
  RABBITMQ_ROUTING_KEY: "hh"

  # Rust GPS Ingest
  RUST_LOG: "info"
  API_PORT: "3000"

  # Groq AI
  GROQ_API_URL: "https://api.groq.com/openai/v1/chat/completions"
  # Groq a RETIRE llama-3.3-70b-versatile : l API repondait 404 (« NotFound »),
  # ce qui se lisait a tort comme une cle invalide. La cle etait valide.
  # Modeles encore servis au 2026-08-24 : openai/gpt-oss-120b, openai/gpt-oss-20b,
  # qwen/qwen3.6-27b, groq/compound. Verifier avec :
  #   curl -H "Authorization: Bearer $KEY" https://api.groq.com/openai/v1/models
  GROQ_MODEL: "openai/gpt-oss-120b"

  # Destinataire du formulaire de contact du site public.
  # JAMAIS expose au navigateur : le document maitre fait du formulaire le seul
  # canal public et interdit d afficher la moindre coordonnee. Le garder cote
  # serveur est ce qui permet de respecter les deux a la fois.
  CONTACT_RECIPIENT: "contact@belive.tn"

  # Valhalla
  VALHALLA_URL: "http://valhalla:8002"

  # Nominatim (geocoding)
  NOMINATIM_URL: "http://nominatim:8080"

  DOMAIN: "belive.calypso.com"

  # SMTP (non-sensitive)
  SMTP_HOST: "smtp.topnet.tn"
  SMTP_PORT: "25"
  SMTP_SSL: "0"
  SMTP_FROM_NAME: "Calypso"
  SMTP_FROM_EMAIL: "calypso@belive.tn"
