# =============================================================================
# GIS V2 - Ingress: Traefik (built-in with K3s)
# Routes external traffic to internal services
# TLS via certificat COMMERCIAL GlobalSign (voir bloc ci-dessous)
# =============================================================================
#
# ⚠ SERVEUR TN UNIQUEMENT (belive-calypso.com → 41.231.5.146).
#   Ne PAS appliquer sur DZ : DZ s'accède par IP (197.140.9.87), sans domaine —
#   des ingress avec ces hôtes y seraient inertes et relanceraient des
#   challenges ACME impossibles à valider.
#
# DNS requis (déjà en place chez Topnet, vérifié le 2026-08-05) :
#   A  belive-calypso.com      → 41.231.5.146
#   A  www.belive-calypso.com  → 41.231.5.146
#
# Historique : la version précédente de ce fichier portait des domaines
# FICTIFS (*.calypso.com). Les challenges Let's Encrypt sont restés « pending »
# 155 jours et les certificats n'ont jamais été émis. Le nettoyage de ces
# restes est décrit dans SSL-TN-RUNBOOK.md — l'apply seul ne suffit pas.
# =============================================================================

# -----------------------------------------------------------------------------
# CERTIFICAT — GlobalSign AlphaSSL, acheté (PAS Let's Encrypt).
#
#   Secret    : belive-calypso-tls (namespace gisv2), type kubernetes.io/tls
#   Couvre    : www.belive-calypso.com + belive-calypso.com (SAN)
#   Validité  : 2026-08-10 → 2027-02-25  ⚠ À RENOUVELER AVANT CETTE DATE
#
# Le secret est créé HORS git — il contient une clé privée. Sources sur le
# serveur TN, dans ~/ssl : belive-calypso-v2.key (la clé qui correspond ;
# la paire sans « -v2 » est une CSR abandonnée) + fullchain.pem
# (certificat feuille SUIVI de l'intermédiaire, cet ordre exactement).
#
#   kubectl create secret tls belive-calypso-tls -n gisv2 \
#     --cert=fullchain.pem --key=belive-calypso-v2.key \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# ⚠ AUCUNE annotation cert-manager sur l'ingress ci-dessous : elle ferait
# écraser ce certificat payant par une tentative ACME. Les objets Certificate
# hérités (gisv2-frontend-tls / -api- / -mobile-, en échec depuis 164 jours,
# domaines fictifs) ne pointent PAS sur ce secret — d'où son nom distinct.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Frontend Ingress — www.belive-calypso.com (+ apex)
# Un seul certificat SAN couvre les deux hôtes. Les chemins reproduisent
# ceux de l'ip-ingress (y compris /mobile) : même application, deux portes.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: gisv2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.belive-calypso.com
        - belive-calypso.com
      secretName: belive-calypso-tls
  rules:
    - host: www.belive-calypso.com
      http: &app-paths
        paths:
          # API requests → gis-api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # SignalR hub → gis-api (WebSocket support via Traefik)
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Health endpoint → gis-api
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Mobile SPA (servie sous /mobile/)
          - path: /mobile
            pathType: Prefix
            backend:
              service:
                name: mobile
                port:
                  number: 80
          # Everything else → frontend (Angular SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: belive-calypso.com
      http: *app-paths

---
# -----------------------------------------------------------------------------
# HTTP → HTTPS redirect — UNIQUEMENT pour les hôtes nommés.
#
# ⚠ NE PAS étendre à l'accès par IP : l'APK mobile en circulation (v1.1.1)
# cible http://41.231.5.146/api en dur. L'ip-ingress ci-dessous reste en HTTP
# simple tant qu'une version de l'app mobile pointant sur
# https://www.belive-calypso.com n'est pas déployée sur la flotte.
# (Traefik redirectScheme permanent = 308 : la méthode HTTP est préservée,
# les POST survivent à la redirection.)
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-redirect
  namespace: gisv2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: gisv2-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.belive-calypso.com
      http: &redirect-paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: belive-calypso.com
      http: *redirect-paths

---
# -----------------------------------------------------------------------------
# Nominatim StripPrefix middleware (removes /api/nominatim from path)
# /api/nominatim/search → /search on nominatim:8080
# -----------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-nominatim-prefix
  namespace: gisv2
spec:
  stripPrefix:
    prefixes:
      - /api/nominatim

---
# -----------------------------------------------------------------------------
# Nominatim IngressRoute — routes /api/nominatim/* to Nominatim service
# Must be separate from the standard Ingress to apply StripPrefix middleware
# -----------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nominatim-route
  namespace: gisv2
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/api/nominatim`)
      kind: Rule
      middlewares:
        - name: strip-nominatim-prefix
      services:
        - name: nominatim
          port: 8080

---
# -----------------------------------------------------------------------------
# IP-based Ingress — accès direct par IP, en HTTP, SANS redirection.
# Voie de survie pour : l'APK mobile actuelle (http://41.231.5.146),
# les tests, et le secours si le TLS casse un jour.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ip-ingress
  namespace: gisv2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # API requests → gis-api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # SignalR hub → gis-api
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Health check
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Mobile app → mobile service (served under /mobile/ prefix)
          - path: /mobile
            pathType: Prefix
            backend:
              service:
                name: mobile
                port:
                  number: 80
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
# Traefik middleware for HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: gisv2
spec:
  redirectScheme:
    scheme: https
    permanent: true
