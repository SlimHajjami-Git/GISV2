# =============================================================================
# GIS V2 - Ingress: Traefik (built-in with K3s)
# Routes external traffic to internal services
# TLS via cert-manager + Let's Encrypt
# =============================================================================
#
# ⚠ SERVEUR TN UNIQUEMENT (belive-calypso.com → 41.231.5.146).
#   Ne PAS appliquer sur DZ : DZ s'accède par IP (197.140.9.87), sans domaine —
#   des ingress avec ces hôtes y seraient inertes et relanceraient des
#   challenges ACME impossibles à valider.
#
# DNS requis (déjà en place chez Topnet, vérifié le 2026-08-05) :
#   A  belive-calypso.com      → 41.231.5.146
#   A  www.belive-calypso.com  → 41.231.5.146
#
# Historique : la version précédente de ce fichier portait des domaines
# FICTIFS (*.calypso.com). Les challenges Let's Encrypt sont restés « pending »
# 155 jours et les certificats n'ont jamais été émis. Le nettoyage de ces
# restes est décrit dans SSL-TN-RUNBOOK.md — l'apply seul ne suffit pas.
# =============================================================================

# -----------------------------------------------------------------------------
# Certificate Issuer (Let's Encrypt production)
# L'e-mail reçoit uniquement les alertes d'expiration — boîte réellement lue.
# -----------------------------------------------------------------------------
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: hajjami.selim@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: traefik

---
# -----------------------------------------------------------------------------
# Frontend Ingress — www.belive-calypso.com (+ apex)
# Un seul certificat SAN couvre les deux hôtes. Les chemins reproduisent
# ceux de l'ip-ingress (y compris /mobile) : même application, deux portes.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: gisv2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.belive-calypso.com
        - belive-calypso.com
      secretName: gisv2-frontend-tls
  rules:
    - host: www.belive-calypso.com
      http: &app-paths
        paths:
          # API requests → gis-api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # SignalR hub → gis-api (WebSocket support via Traefik)
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Health endpoint → gis-api
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Mobile SPA (servie sous /mobile/)
          - path: /mobile
            pathType: Prefix
            backend:
              service:
                name: mobile
                port:
                  number: 80
          # Everything else → frontend (Angular SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: belive-calypso.com
      http: *app-paths

---
# -----------------------------------------------------------------------------
# HTTP → HTTPS redirect — UNIQUEMENT pour les hôtes nommés.
#
# ⚠ NE PAS étendre à l'accès par IP : l'APK mobile en circulation (v1.1.1)
# cible http://41.231.5.146/api en dur. L'ip-ingress ci-dessous reste en HTTP
# simple tant qu'une version de l'app mobile pointant sur
# https://www.belive-calypso.com n'est pas déployée sur la flotte.
# (Traefik redirectScheme permanent = 308 : la méthode HTTP est préservée,
# les POST survivent à la redirection.)
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-redirect
  namespace: gisv2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: gisv2-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: www.belive-calypso.com
      http: &redirect-paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: belive-calypso.com
      http: *redirect-paths

---
# -----------------------------------------------------------------------------
# Nominatim StripPrefix middleware (removes /api/nominatim from path)
# /api/nominatim/search → /search on nominatim:8080
# -----------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-nominatim-prefix
  namespace: gisv2
spec:
  stripPrefix:
    prefixes:
      - /api/nominatim

---
# -----------------------------------------------------------------------------
# Nominatim IngressRoute — routes /api/nominatim/* to Nominatim service
# Must be separate from the standard Ingress to apply StripPrefix middleware
# -----------------------------------------------------------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nominatim-route
  namespace: gisv2
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: PathPrefix(`/api/nominatim`)
      kind: Rule
      middlewares:
        - name: strip-nominatim-prefix
      services:
        - name: nominatim
          port: 8080

---
# -----------------------------------------------------------------------------
# IP-based Ingress — accès direct par IP, en HTTP, SANS redirection.
# Voie de survie pour : l'APK mobile actuelle (http://41.231.5.146),
# les tests, et le secours si le TLS casse un jour.
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ip-ingress
  namespace: gisv2
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # API requests → gis-api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # SignalR hub → gis-api
          - path: /hubs
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Health check
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: gis-api
                port:
                  number: 5000
          # Mobile app → mobile service (served under /mobile/ prefix)
          - path: /mobile
            pathType: Prefix
            backend:
              service:
                name: mobile
                port:
                  number: 80
          # Everything else → frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
# Traefik middleware for HTTPS redirect
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: gisv2
spec:
  redirectScheme:
    scheme: https
    permanent: true
