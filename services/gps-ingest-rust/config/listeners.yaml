listeners:
  # NOTE: protocol controls which decoder AND which GPS model metadata we infer.
  # gps_type_1 => NEMS model (legacy "L" firmware), gps_type_2 => NEMS "S" firmware.
  # noron => Noron NR024 binary protocol tracker.
  # Add new entries for future trackers to automatically tag the devices.
  - port: 6100
    protocol: gps_type_1
    transport: tcp
  - port: 6200
    protocol: gps_type_2
    transport: tcp
  - port: 6210
    protocol: gps_type_2_1
    transport: tcp
  - port: 6300
    protocol: noron
    transport: udp
  # teltonika => Codec 8 / 8 Extended TCP (FMB120, FMB130, FMB150, FMC130, FMU130, FMM130)
  # Devices configure their server URL to this host:port. IMEI handshake then
  # binary AVL frames; see src/telemetry/teltonika.rs for the IO ID mapping.
  - port: 6400
    protocol: teltonika
    transport: tcp
  # gt06 => Concox binary TCP (GT06, GT06N, TR06, JT701, JM-VL01, Coban "GT06" clones).
  # Magic 0x7878/0x7979, BCD IMEI login, CRC-ITU. See src/telemetry/gt06.rs.
  - port: 6500
    protocol: gt06
    transport: tcp
  # coban => TK103/TK303 ASCII TCP. *HQ,IMEI,V1,... and imei:...,tracker,...
  # sentences. See src/telemetry/coban.rs.
  - port: 6600
    protocol: coban
    transport: tcp
