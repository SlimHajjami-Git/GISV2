listeners:
  # NOTE: protocol controls which decoder AND which GPS model metadata we infer.
  # gps_type_1 => NEMS model (legacy "L" firmware), gps_type_2 => NEMS "S" firmware.
  # noron => Noron NR024 binary protocol tracker.
  # Add new entries for future trackers to automatically tag the devices.
  - port: 6100
    protocol: gps_type_1
    transport: tcp
  - port: 6200
    protocol: gps_type_2
    transport: tcp
  - port: 6210
    protocol: gps_type_2_1
    transport: tcp
  - port: 6300
    protocol: noron
    transport: udp
  # teltonika => Codec 8 / 8 Extended TCP (FMB130, FMB150, FMC130, FMU130, FMM130)
  # Devices configure their server URL to this host:port. IMEI handshake then
  # binary AVL frames; see src/telemetry/teltonika.rs for the IO ID mapping.
  - port: 6400
    protocol: teltonika
    transport: tcp
