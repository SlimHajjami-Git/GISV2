# ============================================================================
#  GISV2 — CI/CD (GitHub Actions)
#
#  CI  : runs on GitHub-hosted runners for every PR + push to master
#        (backend dotnet test, frontend ng build AOT, rust cargo build).
#  CD  : runs on SELF-HOSTED runners installed on each server (labels 'dz' / 'tn'),
#        reusing k8s/update.sh — required because registry.local:5000 and the K3s
#        API are only reachable from the server itself.
#
#  Per-deployment config: TN uses the git defaults (Calypso / TND). DZ flips only
#  the currency to DZD (sed) — brand/map stay identical to TN for now.
#
#  DÉPLOIEMENT MANUEL, JAMAIS AUTOMATIQUE (décision du 20/09/2026). Les deux jobs
#  de déploiement partaient tout seuls à chaque poussée sur master, DZ puis TN
#  enchaîné : pousser une correction destinée à la production repeignait d'abord
#  le serveur de test, dont le frontend a divergé fichier par fichier, et
#  personne ne validait entre les deux. Ils ne se lancent plus que depuis
#  l'onglet Actions (« Run workflow »), un serveur à la fois, choisi à la main.
#  Aucun runner auto-hébergé n'est installé aujourd'hui (vérifié sur TN et DZ le
#  20/09) : ces jobs ne peuvent donc PAS se déclencher tant qu'on n'en installe
#  pas un, et la mise en production se fait à la main (voir la compétence /deploy).
#  La CI, elle, tourne toujours à chaque poussée et à chaque PR.
#
#  (docs/CICD-SETUP.md, cité par la version d'origine, n'a jamais été écrit.)
# ============================================================================
name: CI/CD

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      cible:
        description: "Serveur à déployer (rien n'est déployé sans ce choix)"
        required: true
        type: choice
        options: [ aucun, dz, tn ]
        default: aucun

permissions:
  contents: read

jobs:
  # ───────────────────────────── CI ─────────────────────────────
  backend-tests:
    name: CI · backend (dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # Le projet de tests est services/tests/GisAPI.Tests (celui déclaré dans
      # GisAPI.sln). La CI pointait sur services/GisAPI.Tests, un doublon resté
      # hors solution et non compilable depuis le refactor CQRS de février : ce
      # job était donc rouge à chaque poussée.
      - run: dotnet test services/tests/GisAPI.Tests/GisAPI.Tests.csproj -c Release

  frontend-build:
    name: CI · frontend (ng build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/gis-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: services/gis-frontend
      - run: npm run build -- --configuration=production
        working-directory: services/gis-frontend

  ingest-build:
    name: CI · rust ingest (cargo build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - run: cargo build --release
        working-directory: services/gps-ingest-rust

  # ─────────────────────────── Deploy DZ (test) ───────────────────────────
  deploy-dz:
    name: Deploy · DZ (test)
    needs: [ backend-tests, frontend-build, ingest-build ]
    # Jamais sur une poussée : uniquement « Run workflow » avec cible = dz.
    if: github.event_name == 'workflow_dispatch' && inputs.cible == 'dz'
    runs-on: [ self-hosted, dz ]
    environment: dz-test
    steps:
      - uses: actions/checkout@v4
      - name: Per-deployment config — DZ uses Dinar algérien (DZD)
        run: sed -i "s/defaultCurrency: 'TND'/defaultCurrency: 'DZD'/" services/gis-frontend/src/environments/environment.ts
      - name: Build & roll out (frontend + api)
        run: |
          chmod +x k8s/update.sh
          sudo bash k8s/update.sh frontend
          sudo bash k8s/update.sh api
          sudo kubectl set env deployment/gis-api App__DefaultCurrency=DZD -n gisv2
        # ⚠ NEVER run "update.sh config" — it overwrites live-patched secrets.

  # ─────────────────────────── Deploy TN (prod) ───────────────────────────
  deploy-tn:
    name: Deploy · TN (prod)
    # Plus enchaîné derrière DZ : la production ne dépend pas du serveur de test.
    needs: [ backend-tests, frontend-build, ingest-build ]
    if: github.event_name == 'workflow_dispatch' && inputs.cible == 'tn'
    runs-on: [ self-hosted, tn ]
    environment: tn-prod
    steps:
      - uses: actions/checkout@v4
      # TN keeps the git defaults (brandName Calypso, defaultCurrency TND) — no render.
      - name: Build & roll out (frontend + api)
        run: |
          chmod +x k8s/update.sh
          sudo bash k8s/update.sh frontend
          sudo bash k8s/update.sh api
        # ⚠ NEVER run "update.sh config" — it overwrites the live-patched Groq key + secrets.
