services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis_v2"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Calypso@2026+}
      POSTGRES_DB: gis_v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gisadmin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-Calypso@2026+}
      RABBITMQ_LOOPBACK_USERS: none
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  gis-api:
    build:
      context: ./services
      dockerfile: GisAPI/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=postgres;Database=gis_v2;Username=postgres;Password=${POSTGRES_PASSWORD:-Calypso@2026+}
      Jwt__Key: ${JWT_SECRET_KEY:-YourSuperSecretKeyForProductionAtLeast32Characters!}
      Jwt__Issuer: GisAPI
      Jwt__Audience: GisAPI
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: ${RABBITMQ_USER:-gisadmin}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-Calypso@2026+}
      RabbitMQ__Exchange: telemetry.raw
      RabbitMQ__Queue: gps.telemetry.dotnet
      RabbitMQ__RoutingKey: hh
      Redis__ConnectionString: redis:6379,abortConnect=false
      Valhalla__Url: http://valhalla:8002
    restart: unless-stopped

  gps-ingest:
    build:
      context: ./services/gps-ingest-rust
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-Calypso@2026+}@postgres:5432/gis_v2
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-gisadmin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-Calypso@2026+}
      RABBITMQ_EXCHANGE: telemetry.raw
      RABBITMQ_ROUTING_KEY: hh
      REDIS_URL: redis://redis:6379
      API_PORT: 3000
      RUST_LOG: info
    ports:
      - "3000:3000"   # HTTP API
      - "6100:6100"   # GPS type 1 (TCP)
      - "6200:6200"   # GPS type 2 (TCP)
      - "6210:6210"   # GPS type 2.1 (TCP)
    restart: unless-stopped

  frontend:
    build:
      context: ./services/gis-frontend
      dockerfile: Dockerfile.prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      gps-ingest:
        condition: service_started
      gis-api:
        condition: service_started
    ports:
      - "80:80"
    restart: unless-stopped

  mobile:
    build:
      context: ./services/gis-mobile
      dockerfile: Dockerfile.prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      gis-api:
        condition: service_started
    ports:
      - "8100:80"
    restart: unless-stopped

  # Valhalla routing service for road snapping (replaces OSRM - better map-matching)
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: gisv2-valhalla
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 300s
    environment:
      - tile_urls=https://download.geofabrik.de/africa/tunisia-latest.osm.pbf
      - serve_tiles=True
      - build_tar=False
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - server_threads=2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - valhalla_data:/custom_files
    ports:
      - "8002:8002"
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  valhalla_data:
